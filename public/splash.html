
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Listara</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #FF6B35 0%, #E8551E 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .splash-card {
            text-align: center;
            padding: 40px;
            animation: fadeIn 0.8s ease-out;
        }
        .logo-icon {
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
            animation: bounce 2s ease-in-out infinite;
        }
        .logo-icon svg {
            width: 100%;
            height: 100%;
        }
        .logo-text {
            font-size: 48px;
            font-weight: 800;
            color: white;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }
        .tagline {
            font-size: 16px;
            color: rgba(255,255,255,0.9);
            margin-bottom: 30px;
        }
        .description {
            color: rgba(255,255,255,0.8);
            font-size: 14px;
            margin: 20px 0;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.5s forwards;
        }
        .description:nth-child(1) { animation-delay: 0.2s; }
        .description:nth-child(2) { animation-delay: 0.5s; }
        .description:nth-child(3) { animation-delay: 0.8s; }
        .description:nth-child(4) { animation-delay: 1.1s; }
        .loading-bar {
            width: 200px;
            height: 3px;
            background: rgba(255,255,255,0.3);
            border-radius: 3px;
            margin: 30px auto;
            overflow: hidden;
        }
        .loading-progress {
            width: 0%;
            height: 100%;
            background: white;
            border-radius: 3px;
            animation: load 10s linear forwards;
        }
        .percentage {
            font-size: 24px;
            font-weight: 700;
            color: white;
            margin-top: 10px;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes load {
            to { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="splash-card">
        <div class="logo-icon">
            <svg viewBox="0 0 512 512" fill="none">
                <rect width="512" height="512" rx="115" fill="white"/>
                <circle cx="256" cy="256" r="180" fill="#FF6B35"/>
                <path d="M 180 200 C 180 160, 332 160, 332 200" fill="none" stroke="white" stroke-width="20" stroke-linecap="round"/>
                <path d="M 140 240 L 372 240 C 390 240, 395 260, 385 310 L 365 340 C 355 355, 335 360, 310 360 L 202 360 C 177 360, 157 355, 147 340 L 127 310 C 117 260, 122 240, 140 240 Z" fill="white"/>
                <rect x="155" y="245" width="202" height="12" rx="6" fill="#FF6B35"/>
                <rect x="150" y="275" width="212" height="12" rx="6" fill="#FF6B35"/>
                <rect x="160" y="305" width="192" height="12" rx="6" fill="#FF6B35"/>
                <circle cx="210" cy="340" r="12" fill="#FF6B35"/>
                <circle cx="302" cy="340" r="12" fill="#FF6B35"/>
            </svg>
        </div>
        <div class="logo-text">LISTARA</div>
        <div class="tagline">Smart Kitchen Management</div>
        <div class="description">✨ Smart inventory tracking for your kitchen</div>
        <div class="description">🛒 Auto-generates shopping lists</div>
        <div class="description">🍳 Discover recipes from available ingredients</div>
        <div class="description">💬 Connect with chefs in real-time</div>
        <div class="loading-bar"><div class="loading-progress"></div></div>
        <div class="percentage" id="percentage">0%</div>
    </div>
    <script>
        let percent = 0;
        const percentageEl = document.getElementById('percentage');
        const interval = setInterval(() => {
            percent += 10;
            percentageEl.textContent = percent + '%';
            if (percent >= 100) clearInterval(interval);
        }, 1000);
        setTimeout(() => { window.location.href = '/'; }, 10000);
    </script>
</body>
</html>
