<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Install Listara</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #FF6B35, #4ECDC4);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: white;
            border-radius: 30px;
            padding: 40px 30px;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }
        .logo {
            font-size: 80px;
            margin-bottom: 20px;
        }
        h1 {
            color: #FF6B35;
            margin-bottom: 10px;
        }
        .steps {
            text-align: left;
            margin: 30px 0;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 15px;
        }
        .step {
            margin: 15px 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .step-number {
            width: 30px;
            height: 30px;
            background: #FF6B35;
            color: white;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        button {
            background: #FF6B35;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 18px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            margin-top: 20px;
        }
        .note {
            font-size: 12px;
            color: #666;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">📱</div>
        <h1>Install Listara</h1>
        <p>Get the app on your phone</p>
        
        <div class="steps">
            <div class="step">
                <span class="step-number">1</span>
                <span>Tap the Share button</span>
            </div>
            <div class="step">
                <span class="step-number">2</span>
                <span>Scroll to "Add to Home Screen"</span>
            </div>
            <div class="step">
                <span class="step-number">3</span>
                <span>Tap "Add"</span>
            </div>
        </div>
        
        <button onclick="window.location.href='/'">Launch App</button>
        
        <div class="note">
            💡 Tip: Open this page in Safari (iPhone) or Chrome (Android)
        </div>
    </div>
</body>
</html>
