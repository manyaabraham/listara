<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Listara - Smart Kitchen Manager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            overflow: hidden;
            background: linear-gradient(135deg, #FF6B35 0%, #4ECDC4 100%);
            min-height: 100vh;
        }

        /* Animated Background */
        .animated-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }

        .circle {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: float 20s infinite ease-in-out;
        }

        .circle:nth-child(1) {
            width: 300px;
            height: 300px;
            top: -150px;
            left: -150px;
            animation-delay: 0s;
        }

        .circle:nth-child(2) {
            width: 500px;
            height: 500px;
            bottom: -250px;
            right: -250px;
            animation-delay: 5s;
        }

        .circle:nth-child(3) {
            width: 200px;
            height: 200px;
            top: 50%;
            left: 20%;
            animation-delay: 2s;
        }

        .circle:nth-child(4) {
            width: 150px;
            height: 150px;
            bottom: 20%;
            right: 15%;
            animation-delay: 8s;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }
            50% {
                transform: translateY(-50px) rotate(180deg);
            }
        }

        /* Main Content */
        .splash-container {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .splash-card {
            max-width: 500px;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 40px;
            padding: 50px 30px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0,0,0,0.2);
            animation: slideUp 0.8s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Logo Animation */
        .logo-wrapper {
            animation: bounce 2s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        .logo-icon {
            font-size: 80px;
            display: inline-block;
            animation: rotate 3s linear infinite;
        }

        @keyframes rotate {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        .logo-text {
            font-size: 48px;
            font-weight: bold;
            background: linear-gradient(135deg, #FF6B35, #4ECDC4);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-top: 20px;
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.7;
            }
        }

        .tagline {
            font-size: 18px;
            color: #666;
            margin-top: 10px;
            animation: fadeIn 1s ease-out 0.5s both;
        }

        /* Features Grid */
        .features {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin: 40px 0;
            animation: fadeInUp 1s ease-out 1s both;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .feature {
            padding: 15px;
            background: rgba(255, 107, 53, 0.1);
            border-radius: 20px;
            transition: transform 0.3s;
        }

        .feature:hover {
            transform: translateY(-5px);
        }

        .feature-emoji {
            font-size: 32px;
            display: block;
            margin-bottom: 8px;
        }

        .feature-text {
            font-size: 14px;
            color: #333;
            font-weight: 500;
        }

        /* Buttons */
        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
            animation: fadeInUp 1s ease-out 1.5s both;
        }

        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: linear-gradient(135deg, #FF6B35, #E55A2B);
            color: white;
            box-shadow: 0 10px 20px rgba(255, 107, 53, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(255, 107, 53, 0.4);
        }

        .btn-secondary {
            background: white;
            color: #FF6B35;
            border: 2px solid #FF6B35;
        }

        .btn-secondary:hover {
            background: #FF6B35;
            color: white;
            transform: translateY(-2px);
        }

        /* Loading Bar */
        .loading-bar {
            width: 100%;
            height: 4px;
            background: rgba(255, 107, 53, 0.2);
            border-radius: 2px;
            margin-top: 40px;
            overflow: hidden;
            animation: fadeIn 1s ease-out 2s both;
        }

        .loading-progress {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #FF6B35, #4ECDC4);
            border-radius: 2px;
            animation: load 2s ease-out forwards;
        }

        @keyframes load {
            to {
                width: 100%;
            }
        }

        .loading-text {
            font-size: 12px;
            color: #999;
            margin-top: 10px;
            text-align: center;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .splash-card {
                padding: 40px 20px;
            }
            .logo-text {
                font-size: 36px;
            }
            .features {
                gap: 15px;
            }
            .btn {
                padding: 12px 24px;
                font-size: 14px;
            }
        }

        /* Particle Animation */
        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            pointer-events: none;
            animation: particleFloat 3s ease-out forwards;
        }

        @keyframes particleFloat {
            to {
                transform: translateY(-100px);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="animated-bg">
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
    </div>

    <div class="splash-container">
        <div class="splash-card">
            <div class="logo-wrapper">
                <div class="logo-icon">🍽️</div>
            </div>
            <h1 class="logo-text">Listara</h1>
            <p class="tagline">Smart Kitchen Manager</p>

            <div class="features">
                <div class="feature">
                    <span class="feature-emoji">🥬</span>
                    <div class="feature-text">Smart Inventory</div>
                </div>
                <div class="feature">
                    <span class="feature-emoji">🛒</span>
                    <div class="feature-text">Auto Shopping Lists</div>
                </div>
                <div class="feature">
                    <span class="feature-emoji">🍳</span>
                    <div class="feature-text">Recipe Ideas</div>
                </div>
                <div class="feature">
                    <span class="feature-emoji">📱</span>
                    <div class="feature-text">Mobile First</div>
                </div>
            </div>

            <div class="buttons">
                <button onclick="openApp()" class="btn btn-primary">
                    🚀 Launch App
                </button>
                <button onclick="installApp()" class="btn btn-secondary">
                    📲 Install App
                </button>
            </div>

            <div class="loading-bar">
                <div class="loading-progress"></div>
            </div>
            <div class="loading-text">Loading amazing features...</div>
        </div>
    </div>

    <script>
        // Particle effect on click
        document.addEventListener('click', function(e) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = e.clientX + 'px';
            particle.style.top = e.clientY + 'px';
            particle.style.width = Math.random() * 10 + 5 + 'px';
            particle.style.height = particle.style.width;
            document.body.appendChild(particle);
            setTimeout(() => particle.remove(), 3000);
        });

        // Auto-redirect after loading
        setTimeout(() => {
            window.location.href = '/';
        }, 3000);

        function openApp() {
            window.location.href = '/';
        }

        function installApp() {
            // Check if PWA can be installed
            if (window.matchMedia('(display-mode: standalone)').matches) {
                alert('App is already installed!');
            } else {
                alert('To install:\n\nAndroid: Tap menu → "Install App"\n\niOS: Tap Share → "Add to Home Screen"');
            }
        }
    </script>
</body>
</html>
