[build]
  command = "npm run build"
  publish = "dist"

# This ensures splash.html loads first
[[redirects]]
  from = "/"
  to = "/splash.html"
  status = 200
  force = true

# This handles SPA routing after splash
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/sw.js"
  [headers.values]
    Service-Worker-Allowed = "/"
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/splash.html"
  [headers.values]
    Cache-Control = "no-cache"