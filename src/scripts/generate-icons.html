<!DOCTYPE html>
<html>
<head>
    <title>Generate Listara Icons</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .icon-preview {
            display: inline-block;
            margin: 10px;
            text-align: center;
        }
        .icon {
            background: linear-gradient(135deg, #FF6B35, #4ECDC4);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            font-weight: bold;
            border-radius: 20%;
            margin-bottom: 10px;
        }
        button {
            background: #FF6B35;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px;
        }
        button:hover {
            background: #E55A2B;
        }
        .sizes {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }
    </style>
</head>
<body>
    <h1>Listara Icon Generator</h1>
    <p>Click each button to download the icon, then save them to <code>public/icons/</code> folder</p>
    
    <div class="sizes">
        <div class="icon-preview">
            <div class="icon" style="width:72px;height:72px;font-size:36px;">L</div>
            <button onclick="downloadIcon(72)">Download 72x72</button>
        </div>
        
        <div class="icon-preview">
            <div class="icon" style="width:96px;height:96px;font-size:48px;">L</div>
            <button onclick="downloadIcon(96)">Download 96x96</button>
        </div>
        
        <div class="icon-preview">
            <div class="icon" style="width:128px;height:128px;font-size:64px;">L</div>
            <button onclick="downloadIcon(128)">Download 128x128</button>
        </div>
        
        <div class="icon-preview">
            <div class="icon" style="width:144px;height:144px;font-size:72px;">L</div>
            <button onclick="downloadIcon(144)">Download 144x144</button>
        </div>
        
        <div class="icon-preview">
            <div class="icon" style="width:152px;height:152px;font-size:76px;">L</div>
            <button onclick="downloadIcon(152)">Download 152x152</button>
        </div>
        
        <div class="icon-preview">
            <div class="icon" style="width:192px;height:192px;font-size:96px;">L</div>
            <button onclick="downloadIcon(192)">Download 192x192</button>
        </div>
        
        <div class="icon-preview">
            <div class="icon" style="width:384px;height:384px;font-size:192px;">L</div>
            <button onclick="downloadIcon(384)">Download 384x384</button>
        </div>
        
        <div class="icon-preview">
            <div class="icon" style="width:512px;height:512px;font-size:256px;">L</div>
            <button onclick="downloadIcon(512)">Download 512x512</button>
        </div>
    </div>

    <script>
        function downloadIcon(size) {
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            
            // Draw gradient background
            const gradient = ctx.createLinearGradient(0, 0, size, size);
            gradient.addColorStop(0, '#FF6B35');
            gradient.addColorStop(1, '#4ECDC4');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, size, size);
            
            // Draw border radius for iOS style
            ctx.globalCompositeOperation = 'destination-in';
            ctx.beginPath();
            const radius = size * 0.2;
            ctx.moveTo(radius, 0);
            ctx.lineTo(size - radius, 0);
            ctx.quadraticCurveTo(size, 0, size, radius);
            ctx.lineTo(size, size - radius);
            ctx.quadraticCurveTo(size, size, size - radius, size);
            ctx.lineTo(radius, size);
            ctx.quadraticCurveTo(0, size, 0, size - radius);
            ctx.lineTo(0, radius);
            ctx.quadraticCurveTo(0, 0, radius, 0);
            ctx.fill();
            
            // Reset composite operation
            ctx.globalCompositeOperation = 'source-over';
            
            // Draw letter
            ctx.fillStyle = 'white';
            ctx.font = `bold ${size * 0.5}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('L', size/2, size/2);
            
            // Download
            const link = document.createElement('a');
            link.download = `icon-${size}x${size}.png`;
            link.href = canvas.toDataURL();
            link.click();
        }
    </script>
</body>
</html>
